# The Site Configuration
# Import the theme
theme: jekyll-theme-chirpy

# Change the following value to '/PROJECT_NAME' ONLY IF your site is a project site
# and hosted on GitHub/GitLab's project sites. For example, with the following url:
# https://username.github.io/project-name/, change the `baseurl` to '/project-name'.
# For sites hosted on custom domain, change the `baseurl` to ''.
baseurl: ""

# The language of the website. Modify the default value if you prefer a different language.
# Note: If the visitor uses a browser to visit your site in a different language,
# the page will be auto-translated to their preferred language.
lang: en

# Change to your timezone. (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)
timezone: UTC

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Chugunium # the main title

tagline: Embedded Systems, Rust & Low-Level Programming # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  A blog about embedded systems, Rust programming, and low-level hardware development.

# Fill in the protocol & hostname for your site.
# e.g. 'https://username.github.io' or 'https://example.com'
url: "https://valeriyk.github.io"

github:
  username: valeriyk # change to your github username

# twitter:
#   username: twitter_username # change to your twitter username

# If your site will be hosted on GitHub Pages, omit the protocol from the following value
# e.g. https://username.github.io
# social:
#   name: Your Social Name # it will show as ^^author under title
#   links:
#     # The first element serves as the copyright owner's link
#     - https://twitter.com/username # change to your twitter homepage
#     - https://github.com/username # change to your github homepage
#     # Uncomment below to add more social links
#     # - https://www.facebook.com/username
#     # - https://www.linkedin.com/in/username

google_site_verification: # fill in to your verification string

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

google_analytics:
  id: # fill in your Google Analytics ID
  # Google Analytics pageviews report is disabled by default
  # Uncomment the following line to enable it
  # pv:
  #   proxy_endpoint: # fill in your Google Analytics superProxy endpoint
  #   cache_path: /tmp/pv_cache.json # the local PV cache data, please keep it under `/tmp` folder for compatibility issues.

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color scheme and data attribute (data-mode) of `html` tag.
#
# Light mode: "light"
#
# Dark mode: "dark"
#
# theme-mode: dark

# The CDN endpoint for images.
# Notice that once you assign the CDN, the absolute path (cdn url + path) will be used for all images in the post.
# img_cdn:

# the avatar on sidebar will be affected by the following variable
# only works when img_cdn is assigned
# avatar: # /assets/img/avatar.jpg

# boolean type, the global switch for ToC in posts.
toc: true

comments:
  active: # The global switch for posts comments, e.g., 'disqus', 'utterances', 'giscus'
  # The following are settings for disqus, this redundancy is to facilitate synction with the official start page.
  disqus:
    shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-disqus-shortname
# utterances settings › https://utterances.es/
  utterances:
    repo: # <gh-username>/<gh-repo>
    issue_term: # < url | pathname | title | og:title>
  # Giscus options › https://giscus.app
  giscus:
    repo_id: # leave empty when the option(s) below are configured
    category_id: # default to '1' (Announcements)
    mapping: # default to 'pathname'
    reactions_enabled: # default to the value of `1`
    input_position: # default to 'bottom'
    lang: # default to the value of `site.lang`

# Self-hosted static assets, optional › https://github.com/cotes2020/jekyll-theme-chirpy/wiki/Self-Hosted-Static-Assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    # specify the Jekyll environment, empty means both
    # only works if `assets.self_host.enabled` is 'true'
    env: # [development|production]

pwa:
  enabled: true # the option for PWA feature (installable)
  cache:
    enabled: true # the option for the cache strategy of PWA
    path_list: # change this list if the PWA cache your site's certain pages in the `/assets` folder
      - /assets/

paginate: 10

# The base URL of your site
jekyll:
  environment: production
